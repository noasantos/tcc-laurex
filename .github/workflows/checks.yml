name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run mcp:poc
      - run: npm audit --omit=dev --audit-level=high
